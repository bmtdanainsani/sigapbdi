services:
  - type: web
    name: credit-scoring-survey-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
